# Local stack: http://localhost:8080 is the only entry point (nginx → API).
# Postgres is reachable from this machine only, on 127.0.0.1:5433.
name: jes-booking

x-app-env: &app-env
  env_file: .env

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: jes
      POSTGRES_USER: jes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      TZ: UTC
    ports: ["127.0.0.1:5433:5432"]
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jes -d jes"]
      interval: 3s
      retries: 20

  # one-shot: migrations, first-run seed and the least-privilege jes_app role (owner credentials stay here)
  migrate:
    <<: *app-env
    build: { context: ., dockerfile: infra/api.Dockerfile }
    image: jes-api:local
    command: ["node", "dist/migrate.js"]
    environment:
      DATABASE_URL: postgres://jes:${POSTGRES_PASSWORD}@db:5432/jes
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set in .env}
    depends_on: { db: { condition: service_healthy } }
    restart: "no"

  api:
    <<: *app-env
    image: jes-api:local
    environment:
      DATABASE_URL: postgres://jes_app:${APP_DB_PASSWORD}@db:5432/jes
      POSTGRES_PASSWORD: ""
      FILES_DIR: /data/files
    expose: ["3000"]
    volumes: [files:/data/files]
    depends_on: { migrate: { condition: service_completed_successfully } }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/v1/ready || exit 1"]
      interval: 5s
      retries: 20

  worker:
    <<: *app-env
    image: jes-api:local
    command: ["node", "dist/worker.js"]
    environment:
      DATABASE_URL: postgres://jes_app:${APP_DB_PASSWORD}@db:5432/jes
      POSTGRES_PASSWORD: ""
    depends_on: { api: { condition: service_healthy } }

  web:
    build: { context: ., dockerfile: infra/web.Dockerfile }
    image: jes-web:local
    ports: ["8080:8080"]
    depends_on: [api]

volumes:
  pgdata:
  files:
