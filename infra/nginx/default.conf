server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  client_max_body_size 6m;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # re-resolve the api container through Docker DNS, so a recreated api (new IP) doesn't leave nginx returning 502
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:3000;

  location /api/ {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /assets/ {
    include /etc/nginx/conf.d/security-headers.inc;
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location = /sw.js {
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # the app shell must revalidate on every load so a deploy reaches phones immediately (assets are hashed)
  location = /index.html {
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "no-cache";
  }

  location = /manifest.webmanifest {
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
