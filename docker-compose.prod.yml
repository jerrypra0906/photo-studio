# Production: one GCP VM running edge (Caddy, TLS) → web (nginx) → api + worker → PostgreSQL, plus nightly backups.
#   cp .env.production.example .env && chmod 600 .env     (fill every value)
#   docker compose -f docker-compose.prod.yml up -d --build
# Only the edge publishes ports (80/443). See docs/DEPLOY_GCP.md.
name: jes-booking

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

x-hardening: &hardening
  restart: unless-stopped
  logging: *logging
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]

x-app: &app
  <<: *hardening
  image: jes-api:local
  env_file: .env
  read_only: true
  tmpfs: ["/tmp:size=16m"]

services:
  edge:
    <<: *hardening
    image: caddy:2.11.9-alpine
    cap_add: ["NET_BIND_SERVICE"]
    ports: ["${HTTP_PORT:-80}:80", "${HTTPS_PORT:-443}:443"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
      TLS_MODE: ${TLS_MODE:-}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: { web: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 30s
      retries: 3
    deploy: { resources: { limits: { memory: 128m } } }

  web:
    <<: *hardening
    build: { context: ., dockerfile: infra/web.Dockerfile }
    image: jes-web:local
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    depends_on: { api: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      retries: 3
    deploy: { resources: { limits: { memory: 96m } } }

  db:
    <<: *hardening
    image: postgres:18.6-alpine
    cap_drop: []   # the entrypoint must switch to the postgres user and fix data-dir ownership
    environment:
      POSTGRES_DB: jes
      POSTGRES_USER: jes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      TZ: UTC
    # sized for an e2-small / e2-medium VM; the application pools use at most 20 connections
    command: >
      postgres -c shared_buffers=256MB -c effective_cache_size=768MB -c work_mem=8MB
      -c maintenance_work_mem=64MB -c max_connections=50 -c wal_compression=on
      -c checkpoint_timeout=15min -c log_min_duration_statement=500ms -c log_lock_waits=on
    volumes: [pgdata:/var/lib/postgresql]
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jes -d jes"]
      interval: 10s
      retries: 20
    deploy: { resources: { limits: { memory: 768m } } }

  migrate:
    <<: *app
    restart: "no"
    build: { context: ., dockerfile: infra/api.Dockerfile }
    command: ["node", "dist/migrate.js"]
    environment:
      DATABASE_URL: postgres://jes:${POSTGRES_PASSWORD}@db:5432/jes
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set in .env}
    depends_on: { db: { condition: service_healthy } }

  api:
    <<: *app
    environment:
      DATABASE_URL: postgres://jes_app:${APP_DB_PASSWORD}@db:5432/jes
      POSTGRES_PASSWORD: ""
      FILES_DIR: /data/files
      TRUST_PROXY: "2"          # Caddy → nginx → api
      COOKIE_SECURE: "true"
      NODE_OPTIONS: --max-old-space-size=320
    expose: ["3000"]
    volumes: [files:/data/files]
    depends_on: { migrate: { condition: service_completed_successfully } }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/v1/ready || exit 1"]
      interval: 15s
      retries: 10
    stop_grace_period: 20s
    deploy: { resources: { limits: { memory: 448m } } }

  worker:
    <<: *app
    command: ["node", "dist/worker.js"]
    environment:
      DATABASE_URL: postgres://jes_app:${APP_DB_PASSWORD}@db:5432/jes
      POSTGRES_PASSWORD: ""
      NODE_OPTIONS: --max-old-space-size=192
    depends_on: { api: { condition: service_healthy } }
    healthcheck:
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(cat /tmp/worker-heartbeat) / 1000 )) -lt 120"]
      interval: 30s
      retries: 3
    stop_grace_period: 20s
    deploy: { resources: { limits: { memory: 256m } } }

  backup:
    <<: *hardening
    image: postgres:18.6-alpine
    cap_drop: []
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_AT: ${BACKUP_AT:-02:30}
    volumes:
      - ./infra/backup/backup.sh:/backup.sh:ro
      - ./infra/backup/restore.sh:/restore.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
      - files:/data/files   # read for backups, written only by restore.sh
    depends_on: { db: { condition: service_healthy } }
    healthcheck:
      test: ["CMD-SHELL", "test -f /backups/.last-success && test $$(( $$(date -u +%s) - $$(cat /backups/.last-success) )) -lt 93600"]
      interval: 5m
      start_period: 2m
    deploy: { resources: { limits: { memory: 256m } } }

volumes:
  pgdata:
  files:
  caddy_data:
  caddy_config:
